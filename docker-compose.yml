version: '3.8'

services:
  # MongoDB Database
  mongo:
    image: mongo:7.0
    container_name: school_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: school_management
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - school_network

  # Redis (for caching and job queues)
  redis:
    image: redis:7-alpine
    container_name: school_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - school_network

  # Node.js API Server
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: school_api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://admin:password123@mongo:27017/school_management?authSource=admin
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-your_jwt_secret_change_this}
      JWT_EXPIRE: 30d
    depends_on:
      - mongo
      - redis
    volumes:
      - ./uploads:/app/uploads
      - ./reports:/app/reports
    networks:
      - school_network

volumes:
  mongodb_data:
  redis_data:

networks:
  school_network:
    driver: bridge
