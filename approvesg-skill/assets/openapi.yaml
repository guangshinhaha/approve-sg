openapi: 3.0.3
info:
  title: ApproveSG API
  description: Multi-tenant approval workflow engine. API-first, embeddable, with automated chase reminders.
  version: 1.0.0
  contact:
    name: ApproveSG
servers:
  - url: https://approve-sg.up.railway.app/api/v1
    description: Production
  - url: http://localhost:3000/api/v1
    description: Local development

security:
  - ApiKeyAuth: []

components:
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      description: "API key with `asg_live_` prefix. Pass as `Authorization: Bearer asg_live_...`"

  schemas:
    WorkflowStep:
      type: object
      required: [order, label, approver_role, required]
      properties:
        order:
          type: integer
          minimum: 1
        label:
          type: string
          minLength: 1
        approver_role:
          type: string
          minLength: 1
        required:
          type: boolean

    Workflow:
      type: object
      properties:
        id:
          type: string
          format: uuid
        orgId:
          type: string
          format: uuid
        workflowType:
          type: string
        name:
          type: string
        steps:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowStep'
        active:
          type: boolean
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateWorkflow:
      type: object
      required: [workflowType, name, steps]
      properties:
        workflowType:
          type: string
          minLength: 1
          maxLength: 100
        name:
          type: string
          minLength: 1
          maxLength: 255
        steps:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/WorkflowStep'

    UpdateWorkflow:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        steps:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/WorkflowStep'
        active:
          type: boolean

    Submission:
      type: object
      properties:
        id:
          type: string
          format: uuid
        orgId:
          type: string
          format: uuid
        workflowId:
          type: string
          format: uuid
        externalRef:
          type: string
          nullable: true
        externalType:
          type: string
          nullable: true
        payload:
          type: object
          nullable: true
        status:
          type: string
          enum: [draft, pending, approved, rejected, sent_back]
        currentStep:
          type: integer
        stuckSince:
          type: string
          format: date-time
        submittedBy:
          type: string
        submittedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SubmissionDetail:
      allOf:
        - $ref: '#/components/schemas/Submission'
        - type: object
          properties:
            totalSteps:
              type: integer
            currentStepLabel:
              type: string
              nullable: true
            workflowName:
              type: string
            stuckWith:
              type: object
              nullable: true
              properties:
                stepOrder:
                  type: integer
                stepLabel:
                  type: string
                approverRole:
                  type: string
                sinceLastAction:
                  type: string
                  format: date-time
            actions:
              type: array
              items:
                $ref: '#/components/schemas/ApprovalAction'

    CreateSubmission:
      type: object
      required: [workflowId, submittedBy]
      properties:
        workflowId:
          type: string
          format: uuid
        submittedBy:
          type: string
          minLength: 1
          maxLength: 255
        externalRef:
          type: string
        externalType:
          type: string
        payload:
          type: object

    ActionRequest:
      type: object
      required: [actor]
      properties:
        actor:
          type: string
          minLength: 1
          maxLength: 255
        actorRole:
          type: string
          minLength: 1
          maxLength: 100
          default: approver
        comments:
          type: string

    ApprovalAction:
      type: object
      properties:
        id:
          type: string
          format: uuid
        stepOrder:
          type: integer
        action:
          type: string
          enum: [approved, rejected, sent_back]
        actor:
          type: string
        actorRole:
          type: string
          nullable: true
        comments:
          type: string
          nullable: true
        actedAt:
          type: string
          format: date-time

    WebhookRegistration:
      type: object
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
            enum: [submission.approved, submission.rejected, submission.sent_back, step.completed]
        secret:
          type: string
          description: Only returned on creation
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time

    CreateWebhook:
      type: object
      required: [url, events]
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
        events:
          type: array
          minItems: 1
          items:
            type: string
            enum: [submission.approved, submission.rejected, submission.sent_back, step.completed]

    CreateEmbedToken:
      type: object
      required: [email, name, role]
      properties:
        email:
          type: string
          format: email
        name:
          type: string
          minLength: 1
          maxLength: 255
        role:
          type: string
          minLength: 1
          maxLength: 100

    AgingResult:
      type: object
      properties:
        workflowId:
          type: string
          format: uuid
        workflowName:
          type: string
        workflowType:
          type: string
        sampleSize:
          type: integer
        avgHours:
          type: number
        p50Hours:
          type: number
        p95Hours:
          type: number
        minHours:
          type: number
        maxHours:
          type: number

    BottleneckStep:
      type: object
      properties:
        workflowId:
          type: string
          format: uuid
        workflowName:
          type: string
        stepOrder:
          type: integer
        stepLabel:
          type: string
        approverRole:
          type: string
        sampleSize:
          type: integer
        avgHours:
          type: number
        p50Hours:
          type: number
        p95Hours:
          type: number

    ChaseImpactBucket:
      type: object
      properties:
        chasesReceived:
          type: integer
        totalSteps:
          type: integer
        resolvedSteps:
          type: integer
        resolutionRate:
          type: number
        avgHoursToResolve:
          type: number

    Pagination:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer

    Error:
      type: object
      properties:
        error:
          type: string

paths:
  /workflows:
    get:
      summary: List workflows
      description: List active workflows for the caller's organization.
      tags: [Workflows]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Workflow'
    post:
      summary: Create workflow
      tags: [Workflows]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkflow'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workflow'
        '409':
          description: Workflow type already exists

  /workflows/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get workflow
      tags: [Workflows]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workflow'
    put:
      summary: Update workflow
      tags: [Workflows]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkflow'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workflow'

  /submissions:
    get:
      summary: List submissions
      tags: [Submissions]
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, rejected, sent_back]
        - name: workflowId
          in: query
          schema:
            type: string
            format: uuid
        - name: submittedBy
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Submission'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
    post:
      summary: Create submission
      tags: [Submissions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubmission'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'

  /submissions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get submission detail
      description: Returns submission with stuckWith computed field and action history.
      tags: [Submissions]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionDetail'

  /submissions/{id}/approve:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Approve current step
      tags: [Submissions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionRequest'
      responses:
        '200':
          description: Approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'

  /submissions/{id}/reject:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Reject submission
      tags: [Submissions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionRequest'
      responses:
        '200':
          description: Rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'

  /submissions/{id}/send-back:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Send back for revision
      tags: [Submissions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionRequest'
      responses:
        '200':
          description: Sent back
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'

  /embed-tokens:
    post:
      summary: Mint embed token
      description: Create a short-lived JWT for embedding ApproveSG UI in an iframe.
      tags: [Embed]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEmbedToken'
      responses:
        '201':
          description: Token created
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string

  /webhooks:
    get:
      summary: List webhooks
      tags: [Webhooks]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WebhookRegistration'
    post:
      summary: Register webhook
      tags: [Webhooks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWebhook'
      responses:
        '201':
          description: Created (includes secret)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookRegistration'

  /analytics/aging:
    get:
      summary: Approval aging per workflow
      tags: [Analytics]
      parameters:
        - name: workflowId
          in: query
          schema:
            type: string
            format: uuid
        - name: since
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AgingResult'

  /analytics/bottlenecks:
    get:
      summary: Bottleneck steps ranked by slowest
      tags: [Analytics]
      parameters:
        - name: workflowId
          in: query
          schema:
            type: string
            format: uuid
        - name: since
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BottleneckStep'

  /analytics/chase-impact:
    get:
      summary: Chase reminder effectiveness
      tags: [Analytics]
      parameters:
        - name: since
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ChaseImpactBucket'
